<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="hero">
        <div class="hero-top">
            <div class="hero-txt">
                <div class="hero-fast-btn">
                    <img src="assets/hero-bolt-logo.PNG" alt="Bolt">
                    <p>CREATE FOR FAST</p>
                </div>
                <h1>One tool to <span class="hero-txt-line">manage</span><br> contracts and your team</h1>
                <p>Clause helps legal teams work faster, smarter and more efficiently, delivering the visibility<br>and data-driven insights to mitigate risk and ensure compliance.</p>
            </div>
            <div class="hero-btns">
                <button class="hero-btn green-btn">Start for Free</button>
                <button class="hero-btn white-btn">Get a Demo</button>
            </div>
            
            <div class="hero-pic-one"><img src="assets/hero-icon 1.png" alt="" class="partner-icons"></div>
            <div class="hero-pic-two"><img src="assets/hero-icon 2.png" alt="" class="partner-icons"></div>
            <div class="hero-pic-three"><img src="assets/hero-icon 3.png" alt="" class="partner-icons"></div>
            <div class="hero-pic-four"><img src="assets/hero-icon 4.png" alt="" class="partner-icons"></div>

        </div>
        
        <div class="hero-icons">
            <div class="partner-txt"><p>More than 100+<br>companies parner</p></div>
            <div class="partner-icons">
                <img src="assets/hero-logo-hubspot.png" alt="Hubspot">
                <img src="assets/hero-logo dropbox.png" alt="Dropbox">
                <img src="assets/hero-logo square.png" alt="Square">
                <img src="assets/hero-logo intercom.png" alt="Intercom">
                <img src="assets/hero-logo grammerly.png" alt="Grammerly">
            </div>
        </div>
    </section>
